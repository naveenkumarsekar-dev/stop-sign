services:
  honeypot:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["data:/app/data"]
    restart: unless-stopped
  dashboard:
    build: .
    env_file: .env
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["127.0.0.1:8501:8501"]   # dashboard only on localhost; never expose it publicly
    volumes: ["data:/app/data"]
    depends_on: [honeypot]
    restart: unless-stopped
volumes:
  data:
